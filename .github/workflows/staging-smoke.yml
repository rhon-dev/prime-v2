name: Staging Smoke Tests

on:
  workflow_dispatch:
  push:
    branches:
      - docs/staging-playwright

jobs:
  playwright-smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.STAGING_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: tools/smoke/playwright
        run: |
          npm ci
          npm run install-playwright-browsers

      - name: Run Playwright smoke tests
        working-directory: tools/smoke/playwright
        env:
          BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAFF_EMAIL: ${{ secrets.STAGING_STAFF_EMAIL }}
          STAFF_PASSWORD: ${{ secrets.STAGING_STAFF_PASSWORD }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.STAGING_GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.STAGING_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          npx playwright test --reporter=html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tools/smoke/playwright/playwright-report

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: tools/smoke/playwright/test-results || tools/smoke/playwright/artifacts || .
